
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Figma Token Exporter</title>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: #ffffff;
      color: #333;
      font-size: 14px;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: 100%;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .export-section {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 16px;
      background: #f9f9f9;
    }
    
    .export-section h4 {
      margin: 0 0 12px 0;
      color: #333;
      font-size: 14px;
      font-weight: 600;
    }
    
    .export-section p {
      margin: 0 0 12px 0;
      color: #666;
      font-size: 12px;
      line-height: 1.4;
    }
    
    button {
      background: #18a0fb;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    
    button:hover {
      background: #0c8ce9;
    }
    
    button.secondary {
      background: #f0f0f0;
      color: #333;
    }
    
    button.secondary:hover {
      background: #e0e0e0;
    }
    
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    .status {
      font-size: 12px;
      color: #666;
      text-align: center;
      padding: 8px;
      border-radius: 4px;
      margin: 8px 0;
    }
    
    .status.success {
      background: #e8f5e8;
      color: #2d5d2d;
    }
    
    .status.error {
      background: #fee;
      color: #d00;
    }
    
    .download-link {
      display: inline-block;
      background: #28a745;
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 12px;
      margin: 4px;
    }
    
    .download-link:hover {
      background: #218838;
    }
    
    .close-section {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid #e0e0e0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h3>🎨 Figma Token Exporter</h3>
    </div>
    
    <div class="export-section">
      <h4>📊 Exportar Tokens</h4>
      <p>Exporta todas as variáveis/tokens do seu arquivo Figma, incluindo cores, tipografia, espaçamentos, etc.</p>
      <button id="export-tokens-btn">Exportar Tokens</button>
    </div>
    
    <div class="export-section">
      <h4>📁 Exportar Collections</h4>
      <p>Exporta as collections de variáveis, incluindo seus modos e estrutura organizacional.</p>
      <button id="export-collections-btn">Exportar Collections</button>
    </div>
    
    <div id="status" class="status" style="display: none;"></div>
    
    <div id="download-area" style="display: none;">
      <h4>📥 Downloads Disponíveis:</h4>
    </div>
    
    <div class="close-section">
      <button id="close-btn" class="secondary">Fechar Plugin</button>
    </div>
  </div>

  <script>
    // Listen for messages from the plugin code
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      console.log('Received message in UI:', msg);
      
      if (msg && msg.type === 'pong') {
        showStatus('Pong recebido! ✅', 'success');
      }
      
      if (msg && msg.type === 'tokens-exported') {
        showStatus('Tokens exportados com sucesso! ✅', 'success');
        createDownloadLink('tokens.json', msg.data, 'Baixar Tokens JSON');
      }
      
      if (msg && msg.type === 'collections-exported') {
        showStatus('Collections exportadas com sucesso! ✅', 'success');
        createDownloadLink('collections.json', msg.data, 'Baixar Collections JSON');
      }
      
      if (msg && msg.type === 'export-error') {
        showStatus('Erro: ' + msg.message, 'error');
      }
    };

    function showStatus(message, type = '') {
      const statusEl = document.getElementById('status');
      statusEl.textContent = message;
      statusEl.className = 'status ' + type;
      statusEl.style.display = 'block';
      
      // Hide after 3 seconds if success
      if (type === 'success') {
        setTimeout(() => {
          statusEl.style.display = 'none';
        }, 3000);
      }
    }
    
    function createDownloadLink(filename, data, linkText) {
      const downloadArea = document.getElementById('download-area');
      downloadArea.style.display = 'block';
      
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      link.textContent = linkText;
      link.className = 'download-link';
      
      downloadArea.appendChild(link);
    }

    // Export tokens
    document.getElementById('export-tokens-btn').onclick = () => {
      showStatus('Exportando tokens...', '');
      parent.postMessage({ pluginMessage: { type: 'export-tokens' } }, '*');
    };

    // Export collections
    document.getElementById('export-collections-btn').onclick = () => {
      showStatus('Exportando collections...', '');
      parent.postMessage({ pluginMessage: { type: 'export-collections' } }, '*');
    };

    // Close plugin
    document.getElementById('close-btn').onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'close' } }, '*');
    };
  </script>
</body>
</html>
