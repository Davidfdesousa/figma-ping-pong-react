<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), clipboard-write=(), display-capture=(), geolocation=(), accelerometer=(), gyroscope=(), magnetometer=()">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline';">
    <title>Figma Token Exporter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 12px;
            line-height: 1.4;
            color: var(--figma-color-text);
            background: var(--figma-color-bg);
            padding: 16px;
        }

        .container {
            max-width: 100%;
        }

        .section {
            margin-bottom: 24px;
            padding: 16px;
            background: var(--figma-color-bg-secondary);
            border-radius: 8px;
            border: 1px solid var(--figma-color-border);
        }

        .section-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 12px;
            color: var(--figma-color-text);
        }

        .button {
            background: var(--figma-color-bg-brand);
            color: var(--figma-color-text-onbrand);
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            margin-bottom: 8px;
        }

        .button:hover {
            background: var(--figma-color-bg-brand-hover);
        }

        .button:disabled {
            background: var(--figma-color-bg-disabled);
            color: var(--figma-color-text-disabled);
            cursor: not-allowed;
        }

        .button.secondary {
            background: var(--figma-color-bg-secondary);
            color: var(--figma-color-text);
            border: 1px solid var(--figma-color-border);
        }

        .button.secondary:hover {
            background: var(--figma-color-bg-hover);
        }

        .input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--figma-color-border);
            border-radius: 6px;
            background: var(--figma-color-bg);
            color: var(--figma-color-text);
            font-size: 12px;
            margin-bottom: 8px;
        }

        .input:focus {
            outline: none;
            border-color: var(--figma-color-border-brand);
        }

        .collections-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid var(--figma-color-border);
            border-radius: 6px;
            background: var(--figma-color-bg);
        }

        .collection-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid var(--figma-color-border);
        }

        .collection-item:last-child {
            border-bottom: none;
        }

        .collection-checkbox {
            margin-right: 8px;
        }

        .collection-info {
            flex: 1;
        }

        .collection-name {
            font-weight: 500;
            margin-bottom: 2px;
        }

        .collection-details {
            font-size: 11px;
            color: var(--figma-color-text-secondary);
        }

        .status {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 11px;
            margin-bottom: 8px;
        }

        .status.success {
            background: var(--figma-color-bg-success);
            color: var(--figma-color-text-success);
        }

        .status.error {
            background: var(--figma-color-bg-danger);
            color: var(--figma-color-text-danger);
        }

        .status.info {
            background: var(--figma-color-bg-secondary);
            color: var(--figma-color-text);
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--figma-color-text-secondary);
        }

        .github-config {
            display: grid;
            gap: 8px;
        }

        .export-options {
            display: grid;
            gap: 8px;
        }

        .new-feature {
            position: relative;
        }

        .new-feature::after {
            content: 'NEW';
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--figma-color-bg-success);
            color: var(--figma-color-text-onbrand);
            font-size: 8px;
            font-weight: 600;
            padding: 2px 4px;
            border-radius: 4px;
        }

        .zip-icon::before {
            content: '📦';
            margin-right: 6px;
        }

        .github-icon::before {
            content: '🚀';
            margin-right: 6px;
        }

        .download-icon::before {
            content: '⬇️';
            margin-right: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Status Messages -->
        <div id="status-container"></div>

        <!-- Collections Section -->
        <div class="section">
            <div class="section-title">📚 Select Collections</div>
            <button class="button secondary" onclick="loadCollections()">Load Collections</button>
            <div id="collections-container" class="hidden">
                <div id="collections-list" class="collections-list"></div>
            </div>
        </div>

        <!-- Export Options Section -->
        <div class="section">
            <div class="section-title">🎯 Export Options</div>
            <div class="export-options">
                <!-- Traditional Export -->
                <button class="button secondary" onclick="exportSelectedTokens()" id="export-json-btn" disabled>
                    📄 Export Single JSON
                </button>
                
                <!-- New Structured Export -->
                <button class="button new-feature" onclick="exportStructuredTokens()" id="export-structured-btn" disabled>
                    <span class="download-icon"></span>Export Structured Tokens
                </button>
                
                <!-- New ZIP Download -->
                <button class="button new-feature" onclick="downloadTokensZip()" id="download-zip-btn" disabled>
                    <span class="zip-icon"></span>Download Tokens ZIP
                </button>
            </div>
        </div>

        <!-- GitHub Integration Section -->
        <div class="section">
            <div class="section-title">🐙 GitHub Integration</div>
            <button class="button secondary" onclick="toggleGitHubConfig()">Configure GitHub</button>
            
            <div id="github-config" class="github-config hidden">
                <input type="text" id="github-token" class="input" placeholder="GitHub Personal Access Token" />
                <input type="text" id="github-owner" class="input" placeholder="Repository Owner" />
                <input type="text" id="github-repo" class="input" placeholder="Repository Name" />
                <button class="button secondary" onclick="saveGitHubConfig()">Save Configuration</button>
            </div>
            
            <div class="export-options">
                <input type="text" id="commit-description" class="input" placeholder="Commit description (optional)" />
                
                <!-- Traditional GitHub Export -->
                <button class="button secondary" onclick="exportToGitHub()" id="github-export-btn" disabled>
                    <span class="github-icon"></span>Export to GitHub (Single File)
                </button>
                
                <!-- New Structured GitHub Export -->
                <button class="button new-feature" onclick="exportStructuredToGitHub()" id="github-structured-btn" disabled>
                    <span class="github-icon"></span>Export to GitHub (Structured)
                </button>
            </div>
        </div>

        <!-- Brand Management Section -->
        <div class="section">
            <div class="section-title">🎨 Brand Management</div>
            <button class="button secondary" onclick="loadBrands()">Load Brands</button>
            <div id="brands-container" class="hidden">
                <input type="text" id="new-brand-name" class="input" placeholder="New brand name" />
                <select id="base-brand-select" class="input">
                    <option value="">Select base brand</option>
                </select>
                <button class="button" onclick="createBrand()">Create Brand</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        // Global state
        let collectionsData = [];
        let brandsData = [];
        let selectedCollections = [];
        let githubConfigVisible = false;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadGitHubConfig();
        });

        // Message handling from plugin
        window.onmessage = (event) => {
            const message = event.data.pluginMessage;
            handlePluginMessage(message);
        };

        function handlePluginMessage(message) {
            console.log('Received message:', message);

            switch (message.type) {
                case 'collections-loaded':
                    handleCollectionsLoaded(message.data);
                    break;
                case 'brands-loaded':
                    handleBrandsLoaded(message.data);
                    break;
                case 'tokens-exported':
                    handleTokensExported(message.data);
                    break;
                case 'structured-tokens-exported':
                    handleStructuredTokensExported(message.data);
                    break;
                case 'download-tokens-zip':
                    handleDownloadTokensZip(message.data);
                    break;
                case 'github-success':
                    showStatus('GitHub export successful! PR created.', 'success');
                    if (message.prUrl) {
                        showStatus(`<a href="${message.prUrl}" target="_blank">View Pull Request</a>`, 'info');
                    }
                    break;
                case 'github-config-loaded':
                    handleGitHubConfigLoaded(message.data);
                    break;
                case 'github-config-saved':
                    showStatus('GitHub configuration saved!', 'success');
                    break;
                case 'brand-created-in-figma':
                    showStatus(`Brand "${message.brandName}" created successfully!`, 'success');
                    break;
                case 'error':
                case 'github-error':
                case 'zip-error':
                case 'export-error':
                    showStatus(message.message, 'error');
                    break;
                case 'load-error':
                    showStatus(message.message, 'error');
                    break;
                default:
                    console.log('Unhandled message type:', message.type);
            }
        }

        // Collections management
        function loadCollections() {
            showStatus('Loading collections...', 'info');
            parent.postMessage({ pluginMessage: { type: 'load-collections' } }, '*');
        }

        function handleCollectionsLoaded(collections) {
            collectionsData = collections;
            displayCollections();
            showStatus(`Loaded ${collections.length} collections`, 'success');
        }

        function displayCollections() {
            const container = document.getElementById('collections-container');
            const list = document.getElementById('collections-list');
            
            if (collectionsData.length === 0) {
                list.innerHTML = '<div class="loading">No collections found</div>';
                container.classList.remove('hidden');
                return;
            }

            list.innerHTML = collectionsData.map(collection => `
                <div class="collection-item">
                    <input type="checkbox" class="collection-checkbox" 
                           id="collection-${collection.id}" 
                           value="${collection.id}"
                           onchange="updateSelectedCollections()">
                    <div class="collection-info">
                        <div class="collection-name">${collection.name}</div>
                        <div class="collection-details">${collection.variableCount} variables, ${collection.modes.length} modes</div>
                    </div>
                </div>
            `).join('');
            
            container.classList.remove('hidden');
        }

        function updateSelectedCollections() {
            const checkboxes = document.querySelectorAll('.collection-checkbox:checked');
            selectedCollections = Array.from(checkboxes).map(cb => cb.value);
            
            const hasSelection = selectedCollections.length > 0;
            document.getElementById('export-json-btn').disabled = !hasSelection;
            document.getElementById('export-structured-btn').disabled = !hasSelection;
            document.getElementById('download-zip-btn').disabled = !hasSelection;
            document.getElementById('github-export-btn').disabled = !hasSelection;
            document.getElementById('github-structured-btn').disabled = !hasSelection;
        }

        // Export functions
        function exportSelectedTokens() {
            if (selectedCollections.length === 0) {
                showStatus('Please select at least one collection', 'error');
                return;
            }
            
            showStatus('Exporting tokens...', 'info');
            parent.postMessage({ 
                pluginMessage: { 
                    type: 'export-selected-tokens', 
                    selectedCollections 
                } 
            }, '*');
        }

        function exportStructuredTokens() {
            if (selectedCollections.length === 0) {
                showStatus('Please select at least one collection', 'error');
                return;
            }
            
            showStatus('Exporting structured tokens...', 'info');
            parent.postMessage({ 
                pluginMessage: { 
                    type: 'export-structured-tokens', 
                    selectedCollections 
                } 
            }, '*');
        }

        function downloadTokensZip() {
            if (selectedCollections.length === 0) {
                showStatus('Please select at least one collection', 'error');
                return;
            }
            
            showStatus('Preparing ZIP download...', 'info');
            parent.postMessage({ 
                pluginMessage: { 
                    type: 'download-tokens-zip', 
                    selectedCollections 
                } 
            }, '*');
        }

        function handleTokensExported(data) {
            // Traditional JSON download
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            downloadFile(blob, 'figma-tokens.json');
            showStatus('Tokens exported successfully!', 'success');
        }

        function handleStructuredTokensExported(data) {
            // Show structure info
            const fileCount = Object.keys(data.files).length;
            showStatus(`Structured tokens ready! ${fileCount} files generated.`, 'success');
            
            // Could also trigger individual file downloads here if needed
            console.log('Structured tokens:', data);
        }

        function handleDownloadTokensZip(zipData) {
            if (!window.JSZip) {
                showStatus('ZIP library not loaded. Please refresh and try again.', 'error');
                return;
            }

            try {
                const zip = new JSZip();
                
                // Add each file to the ZIP
                for (const [filePath, content] of Object.entries(zipData.files)) {
                    zip.file(filePath, content);
                }
                
                // Generate and download ZIP
                zip.generateAsync({ type: 'blob' }).then(function(blob) {
                    downloadFile(blob, 'figma-tokens.zip');
                    showStatus('ZIP download started!', 'success');
                }).catch(function(error) {
                    console.error('ZIP generation error:', error);
                    showStatus('Error generating ZIP file', 'error');
                });
                
            } catch (error) {
                console.error('ZIP creation error:', error);
                showStatus('Error creating ZIP file', 'error');
            }
        }

        // GitHub functions
        function toggleGitHubConfig() {
            githubConfigVisible = !githubConfigVisible;
            const config = document.getElementById('github-config');
            
            if (githubConfigVisible) {
                config.classList.remove('hidden');
                loadGitHubConfig();
            } else {
                config.classList.add('hidden');
            }
        }

        function loadGitHubConfig() {
            parent.postMessage({ pluginMessage: { type: 'load-github-config' } }, '*');
        }

        function handleGitHubConfigLoaded(config) {
            if (config.token) document.getElementById('github-token').value = config.token;
            if (config.owner) document.getElementById('github-owner').value = config.owner;
            if (config.repo) document.getElementById('github-repo').value = config.repo;
        }

        function saveGitHubConfig() {
            const config = {
                token: document.getElementById('github-token').value,
                owner: document.getElementById('github-owner').value,
                repo: document.getElementById('github-repo').value
            };

            if (!config.token || !config.owner || !config.repo) {
                showStatus('Please fill all GitHub configuration fields', 'error');
                return;
            }

            parent.postMessage({ 
                pluginMessage: { 
                    type: 'save-github-config', 
                    config 
                } 
            }, '*');
        }

        function exportToGitHub() {
            if (selectedCollections.length === 0) {
                showStatus('Please select at least one collection', 'error');
                return;
            }

            const commitDescription = document.getElementById('commit-description').value;
            showStatus('Exporting to GitHub...', 'info');
            
            parent.postMessage({ 
                pluginMessage: { 
                    type: 'export-to-github', 
                    selectedCollections,
                    commitDescription 
                } 
            }, '*');
        }

        function exportStructuredToGitHub() {
            if (selectedCollections.length === 0) {
                showStatus('Please select at least one collection', 'error');
                return;
            }

            const commitDescription = document.getElementById('commit-description').value;
            showStatus('Exporting structured tokens to GitHub...', 'info');
            
            parent.postMessage({ 
                pluginMessage: { 
                    type: 'export-structured-tokens-github', 
                    selectedCollections,
                    commitDescription 
                } 
            }, '*');
        }

        // Brand management
        function loadBrands() {
            showStatus('Loading brands...', 'info');
            parent.postMessage({ pluginMessage: { type: 'load-brands' } }, '*');
        }

        function handleBrandsLoaded(brands) {
            brandsData = brands;
            displayBrands();
            showStatus(`Loaded ${brands.length} brands`, 'success');
        }

        function displayBrands() {
            const container = document.getElementById('brands-container');
            const select = document.getElementById('base-brand-select');
            
            select.innerHTML = '<option value="">Select base brand</option>' +
                brandsData.map(brand => `<option value="${brand.name}">${brand.name}</option>`).join('');
            
            container.classList.remove('hidden');
        }

        function createBrand() {
            const brandName = document.getElementById('new-brand-name').value;
            const baseBrandName = document.getElementById('base-brand-select').value;

            if (!brandName || !baseBrandName) {
                showStatus('Please enter brand name and select base brand', 'error');
                return;
            }

            showStatus('Creating brand...', 'info');
            parent.postMessage({ 
                pluginMessage: { 
                    type: 'create-brand-in-figma', 
                    brandName, 
                    baseBrandName 
                } 
            }, '*');
        }

        // Utility functions
        function showStatus(message, type = 'info') {
            const container = document.getElementById('status-container');
            const statusEl = document.createElement('div');
            statusEl.className = `status ${type}`;
            statusEl.innerHTML = message;
            
            container.appendChild(statusEl);
            
            // Auto-remove after 5 seconds (except errors)
            if (type !== 'error') {
                setTimeout(() => {
                    if (statusEl.parentNode) {
                        statusEl.parentNode.removeChild(statusEl);
                    }
                }, 5000);
            }
            
            // Scroll to show the status
            statusEl.scrollIntoView({ behavior: 'smooth' });
        }

        function downloadFile(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
